name: Tests

# Hermetic test + lint gate for the research core.
#
# STATUS (2026-09-02): LIVE — Actions billing was unblocked mid-2026-09-01 and
# this workflow now runs on every push/PR. The first live runs exposed six
# non-hermetic failures (line-ending-sensitive byte pins + local-artifact
# contracts reading the gitignored runs/results tree); fixed in round 59 by
# LF-normalizing every integrity hash (git-blob form, platform-stable) and by
# explicit skip-with-reason guards on local-artifact contracts. `uv run ruff
# check` is clean repo-wide.
#
# PATHS + PERMISSIONS (2026-11-06 audit): on.push filters to the code surfaces
# this gate actually exercises — src/ scripts/ tests/ + dependency pins + this
# file, PLUS the i18n orphan gate's web inputs (web/src web/scripts
# web/package.json web/pnpm-lock.yaml; pnpm install + scripts/i18n-audit.mjs
# run in web/ and audit web/src/**). main-branch traffic here is >half
# docs/state commits, which no longer burn Actions minutes. pull_request
# deliberately keeps NO paths filter:
# path-filtered PR checks strand the merge in "Expected — Waiting for status"
# when a PR touches only filtered-out files (documented GitHub pitfall).
# workflow_dispatch stays as the full-coverage fallback (run any docs/state
# commit through the gate manually if ever needed). Top-level permissions
# pinned to contents:read — pytest/ruff/i18n-audit write nothing to the repo.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
      - 'web/src/**'
      - 'web/scripts/**'
      - 'web/package.json'
      - 'web/pnpm-lock.yaml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest + ruff (hermetic)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to 26.04 (GH changelog 2026-09-17) — pin for month-stability
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 — node24 re-pin (round 127; v1 was node20, removed from runners 2026-09)
        with:
          version: "latest"
          enable-cache: false  # v1 default was false; v10 default 'auto' would silently enable

      - name: Install dependencies (pinned by uv.lock)
        run: |
          uv sync --all-extras --frozen

      - name: Run hermetic test suite
        run: |
          uv run --frozen pytest -q

      - name: Lint (full repo)
        run: |
          uv run --frozen ruff check

      - name: Set up pnpm (web toolchain)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 — node24 re-pin (round 127; v4 was node20)
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 — node24 re-pin (round 127; v4 was node20)
        with:
          node-version: 22

      - name: i18n orphan gate (web/src)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          node scripts/i18n-audit.mjs --ci
