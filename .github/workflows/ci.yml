name: Tests

# Hermetic test + lint gate for the research core.
#
# STATUS (2026-09-02): LIVE — Actions billing was unblocked mid-2026-09-01 and
# this workflow now runs on every push/PR. The first live runs exposed six
# non-hermetic failures (line-ending-sensitive byte pins + local-artifact
# contracts reading the gitignored runs/results tree); fixed in round 59 by
# LF-normalizing every integrity hash (git-blob form, platform-stable) and by
# explicit skip-with-reason guards on local-artifact contracts. `uv run ruff
# check` is clean repo-wide.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: pytest + ruff (hermetic)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to 26.04 (GH changelog 2026-09-17) — pin for month-stability
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up uv
        uses: astral-sh/setup-uv@162b8acf397cb069dec09a3f5a9847cf71cfa46a # v1
        with:
          version: "latest"

      - name: Install dependencies (pinned by uv.lock)
        run: |
          uv sync --all-extras

      - name: Run hermetic test suite
        run: |
          uv run pytest -q

      - name: Lint (full repo)
        run: |
          uv run ruff check

      - name: Set up pnpm (web toolchain)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: i18n orphan gate (web/src)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          node scripts/i18n-audit.mjs --ci
