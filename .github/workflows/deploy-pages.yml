name: Deploy Static Site to GitHub Pages

# ═══ DISABLED-SINCE-2026-09 (round 86) — DO NOT MANUALLY ENABLE ═══
# This workflow is disabled_manually at the GitHub workflow-state level and is
# retained as a DORMANT RECORD ONLY. The repo's Pages is served by the LEGACY
# gh-pages branch channel (build_type=legacy, source=gh-pages; rounds 50/53
# canonical), and this workflow's actions/deploy-pages mode is incompatible
# with that legacy configuration — see state/current.md round-85/86 forensics
# ("禁用是合理残留"). Live publishing runs through publish-site.yml (code
# pushes) and the gh-pages publish chain inside refresh-terminal-data.yml
# (data commits). Deleting the file needs owner sign-off — tracked as a
# suggestion only, not enacted (2026-11-06 audit).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to 26.04 (GH changelog 2026-09-17) — pin for stability

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 — node24 re-pin (round 127; v4 was node20)
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 — node24 re-pin (round 127; v4 was node20)
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build (static export → web/out)
        working-directory: web
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 — SHA-pin (round 127; was unpinned TAG; composite→node24 upload-artifact v7.0.0)
        with:
          path: ./web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to 26.04 (GH changelog 2026-09-17) — pin for stability
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 — node24 re-pin (round 127; v4 was node20; file stays DORMANT)
