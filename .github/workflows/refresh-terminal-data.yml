name: Refresh terminal data

# Daily data refresh for the Aionis fintech terminal.
# Rebuilds ticker metadata + re-exports all terminal JSON payloads, then
# commits the result. Keeps picks / sectors / track-record / calibration
# current without manual intervention.
#
# Prerequisites (one-time setup in repo Settings → Secrets and variables → Actions):
#   TIINGO_API_KEY  — for US price fetches (phase_b_fetch)
#   FRED_API_KEY    — for macro data (FRED/ALFRED)
# Both are read via .env → aionis.config.settings by the fetch scripts.
#
# Schedule: 22:00 UTC Mon-Fri (after US market close, before Asia open).
# Manual trigger: Actions tab → "Refresh terminal data" → Run workflow.

on:
  schedule:
    - cron: '0 22 * * 1-5'  # 22:00 UTC Mon-Fri
  workflow_dispatch: {}      # manual trigger

permissions:
  contents: write  # needed for git-auto-commit
  actions: write   # needed to workflow_dispatch deploy-pages after the data commit

concurrency:
  group: refresh-terminal-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # Run 31825889043 died at exactly 90min mid-display-fetch:
    # the pre-display chain alone (Form4 20 + 13D 15 + GDELT 20 + misc ~20) eats
    # ~75min, leaving no room for the B1 display steps (fundamentals cold ~20 +
    # prices budget 24 + materialize ~5). 150 lets ONE full cold pass complete;
    # once the fundamentals + prices caches land (first clean save), the job
    # shrinks back to ~60-80min of warm deltas. Same lesson as the 75→90 bump.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Write .env from secrets
        run: |
          # The fetch scripts read API keys via aionis.config.settings, which
          # loads from .env. Recreate it from GitHub Secrets at runtime.
          {
            echo "TIINGO_API_KEY=${{ secrets.TIINGO_API_KEY }}"
            echo "FRED_API_KEY=${{ secrets.FRED_API_KEY }}"
            # Optional: Alpaca (for US price fallback). Leave empty to skip.
            echo "ALPACA_KEY_ID=${{ secrets.ALPACA_KEY_ID }}"
            echo "ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}"
          } > .env

      - name: Restore display-convergence snapshot (guaranteed-persist prices cache)
        # The 4.1GB/12.8k-file data/cache tar races with late writers and its
        # save has failed on effectively every run ("file changed as we read
        # it"), so the display price convergence NEVER persisted across runs
        # (fundamentals re-cold-pulled 20min every time; prices restarted).
        # This small dedicated snapshot (~tens of MB, rsynced only after all
        # fetch steps are done → zero concurrent writers → tar always clean)
        # is the guaranteed-persistence lane for exactly what convergence
        # needs: per-ticker prices + fundamentals parquet.
        uses: actions/cache@v4
        with:
          path: data/display-snapshot
          key: display-snapshot-${{ github.run_id }}
          restore-keys: |
            display-snapshot-

      - name: Seed data/cache from snapshot
        # Overlay the snapshot onto the (restored-or-empty) data/cache so the
        # fetchers warm-start. Best-effort; a missing snapshot dir = cold start.
        run: |
          mkdir -p data/cache/prices
          if [ -d data/display-snapshot/prices ]; then
            cp -a data/display-snapshot/prices/. data/cache/prices/
          fi
          if [ -f data/display-snapshot/phase_b_fundamentals.parquet ]; then
            cp -a data/display-snapshot/phase_b_fundamentals.parquet data/cache/
          fi
          echo "seeded: $(ls data/cache/prices | wc -l) price tickers, fundamentals=$(test -f data/cache/phase_b_fundamentals.parquet && echo yes || echo no)"

      - name: Restore data/cache (fetch deltas, not a full re-pull every run)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: |
            data-cache-
        # The fetchers (cot/form4/13d/macro) are idempotent — per-accession/per-series
        # caches skip already-pulled items. Without this, every daily run re-pulled the
        # full 2016→today Form 4 + 13D history (10 issuers × polite ≥2s) and the job
        # timed out before reaching export. With it, run 1 is cold (full pull); run 2+
        # fetch only new filings and finish in minutes.

      - name: Fetch fresh positioning data (CFTC COT, weekly)
        run: uv run python scripts/cot_fetch.py
        continue-on-error: true  # polite/bounded; failure keeps the old cache

      - name: Fetch fresh insider Form 4 (SEC EDGAR, daily filings)
        run: uv run python scripts/form4_fetch.py
        timeout-minutes: 20  # step cap: Form 4 must NOT block downstream steps
        # (GDELT/reddit/export). With per-issuer checkpointing (05ab7b1), Form 4
        # accumulates across runs; 20min/run → converges over ~5 daily runs.
        continue-on-error: true

      - name: Fetch recent SC 13D stakes (EDGAR daily index, unfreezes past EFTS cutoff)
        run: uv run python scripts/stakes_13d_daily_fetch.py
        timeout-minutes: 40  # step cap: the window grows daily (2024-12-17 → today
        # = 619 calendar days on 2026-08-28, ≈ 19-27min wall in a good window) and
        # the script writes its aggregate ONCE at the end — no per-day checkpoint.
        # The old 15min cap killed every run mid-walk and continue-on-error masked
        # it, so the committed panel silently never advanced (smart_money stuck at
        # 08-21 for two rounds; diagnosed 2026-08-28, local repro: a 900s kill
        # produced zero output). 40min = observed cold walk + multi-month headroom
        # (~+1.5min/month of window growth); revisit if it ever approaches the cap.
        continue-on-error: true  # EDGAR rate-limits; per-day resilient skip

      - name: Fetch recent 8-K material events (EDGAR EFTS, 50 issuers)
        run: uv run python scripts/form8k_fetch.py
        timeout-minutes: 10  # EFTS + per-accession caches are idempotent; daily runs
        # fetch only new filings (cold pull ≈ 3min for 23 docs on 2026-08-21)
        continue-on-error: true

      - name: Fetch IPO registration/pricing stream (EDGAR EFTS form-level)
        run: uv run python scripts/form_ipo_fetch.py
        timeout-minutes: 10  # metadata-only: ~12 EFTS pages for ~1,000 filings
        # (no per-doc fetches); per root-form caches are idempotent
        continue-on-error: true

      - name: Parse IPO cover prices (NEWEST <=80 priced filings, bounded walk)
        # form_ipo_price_parse.py must run AFTER the fetch (its docstring
        # contract): the fetch slides the newest-80 priced window forward daily,
        # and without this walk the panel joins against a stale parse cache —
        # rows ship values the confidence tiers don't back
        # (offer_price_parsed != confidence.exact -> contract gate FAILS,
        # caught locally 2026-09-04). Bounded (<=156 requests, <=170 task cap)
        # and resumable: cached `ok` accessions are never re-fetched, so a warm
        # run spends ~0-16 requests on just the window's slide.
        run: uv run python scripts/form_ipo_price_parse.py
        timeout-minutes: 10
        continue-on-error: true  # a failed walk keeps the prior parse cache honestly

      - name: Fetch House PTR politician trades (STOCK Act filing stream)
        run: uv run python scripts/politician_trades_fetch.py
        timeout-minutes: 10  # 2 polite requests per year (GET token → POST index);
        # per-year parquet caches are idempotent
        continue-on-error: true

      - name: Fetch fresh retail sentiment (Reddit zero-credential RSS)
        run: uv run python scripts/reddit_fetch.py
        continue-on-error: true

      - name: Fetch display-only macro series (ALFRED dollar/yield-curve/unemployment)
        run: uv run python scripts/fetch_macro_display.py --force
        continue-on-error: true  # FRED outage keeps the prior cache

      - name: Fetch display-only VIX for market context (FRED VIXCLS, daily)
        run: uv run python scripts/market_prices_fetch.py
        continue-on-error: true  # FRED outage keeps the prior cache

      - name: Fetch GDELT news sentiment (news_sentiment theme, incremental)
        run: uv run python scripts/news_sentiment_gdelt_fetch.py
        timeout-minutes: 20  # step cap: cold pull = ~38 quarterly chunks × ≥15s ≈
        # 12-15min; same insurance as Form 4/13D caps. Incremental cache means a
        # timeout resumes on the next run without re-fetching cached months.
        continue-on-error: true  # GDELT 429/outage keeps the prior cache

      - name: Rebuild display panel (fresh as_of for terminal themes, option B1)
        # Owner-approved option B1: rebuild a DISPLAY-ONLY panel daily so the
        # terminal's panel-dependent themes (price/fundamentals/risk/market_structure/
        # macro) refresh with real data + as_of timestamps — instead of freezing at
        # the 2026-06-30 research cutoff. The display panel is SEPARATE from the
        # frozen research panel (track_b_panel.parquet): track_b_materialize_panel
        # --display writes display_panel.parquet, never touching the research
        # surface. phase_b_fetch --display writes phase_b_prices_display.parquet
        # (prices through TODAY) without touching the frozen prices. Display-only —
        # neither enters aionis.eval / the research pipeline / ledger / OOS.
        #
        # SPLIT INTO 3 STEPS (run 31818470736 postmortem): a single 30min step
        # had fundamentals cold-pull (~20min, because the cache save kept failing)
        # + prices + materialize in one window, so the price budget (24min from
        # fetch start) never fired before the STEP cap killed everything —
        # orphan writers then corrupted the cache tar ("file changed as we read
        # it") so even the fundamentals parquet never persisted → every run cold
        # again. Separate steps give each its own cap; fundamentals is cached
        # after ONE clean save and turns instant; prices budget only has to fit
        # ITS step.
        run: |
          set +e
          uv run python scripts/fetch_macro_display.py --force >/dev/null 2>&1 || true
          # CPIAUCSL + PAYEMS are panel inputs (not in DISPLAY_SERIES) — fetch inline.
          # DFF likewise: it feeds the fedfunds + real_rate cards, but is NOT in
          # DISPLAY_SERIES because a naive realtime fetch hits FRED's 2000-vintage
          # cap (daily series) — reuse macro_dff's year-sliced vintage fetcher,
          # which writes the same shared alfred_DFF.json cache. Without this, the
          # only DFF supply was the evictable data-cache: on eviction the export
          # silently skipped fedfunds/real_rate and committed a partial "ok" panel
          # (deployed /regime cards hid — regression caught 2026-08-15).
          # NOTE: failures are NOT silenced (no 2>/dev/null) — the step stays
          # best-effort (|| true) but the traceback must land in the run log:
          # a silent DFF miss left a partial cache that killed the contract
          # gate in run 33818402659 (exporter now skips-and-retains instead).
          uv run python -c "from aionis.ingest.macro_display import fetch_display_series; from aionis.ingest.macro_dff import fetch_dff_vintages; from aionis.config import settings; from pathlib import Path; c=Path('data/cache'); [fetch_display_series(settings.fred_api_key, c, s, force=True) for s in ('CPIAUCSL','PAYEMS')]; fetch_dff_vintages(settings.fred_api_key, c)" || true
          uv run python scripts/phase_b_fetch.py --display --fundamentals-only
        timeout-minutes: 25
        continue-on-error: true  # SEC outage keeps the prior cache

      - name: Rebuild display panel prices (B1, budget exit)
        # --budget-minutes: exit GRACEFULLY inside the step window. A hard
        # timeout kill leaves orphan python writers → the cache post-step's
        # tar fails with "file changed as we read it" → cache save fails →
        # every run restarts from 0 cached (observed on runs 31788130986 /
        # 31794374610). With the budget, per-ticker parquets persist in the
        # saved cache and each run resumes — converging over ~3-4 runs.
        run: uv run python scripts/phase_b_fetch.py --display --budget-minutes 24
        timeout-minutes: 27
        continue-on-error: true  # Tiingo/Alpaca outage keeps the prior cache

      - name: Materialize display panel (B1)
        # Expected to fail while the price cache is still converging (the
        # fetch step honestly refuses to write a below-cap partial panel, so
        # materialize finds no panel) — not an error state until coverage
        # lands. Once 587 tickers are cached this step turns the steady win.
        run: uv run python scripts/track_b_materialize_panel.py --display
        timeout-minutes: 15
        continue-on-error: true

      - name: Rebuild ticker metadata (names + sectors)
        run: uv run --with baostock python scripts/build_ticker_metadata.py --no-cache
        continue-on-error: true  # network may fail; old cache still works

      - name: Build regime macro composite (macro theme input)
        # Feeds the themes' macro theme (data/cache/regime_macro.parquet). The
        # fetchers are self-populating (BAA/AAA/DGS10/DGS1 via polite FRED;
        # VIX + DFF from the shared caches this lane already fetches) — first
        # run cold-fetches, the data-cache persists them. PHASE_C_NO_LEDGER=1
        # (default) = artifacts-only, no ledger write.
        run: uv run python scripts/build_regime_macro.py
        timeout-minutes: 10
        continue-on-error: true  # outage degrades the macro theme honestly; the gate enforces the rest

      - name: Re-export all terminal payloads
        run: uv run python scripts/export_terminal_data.py
        # BACKTEST_MONTHS defaults to 99 (full OOS history) in the script.

      - name: Re-export evidence chain (atlas -> dossier -> phase dossiers -> re-pin shelf + manifest)
        # R2-full M4: the evidence artifacts pin panel snapshot_ts and artifact
        # shas, so they must re-render AFTER the payload export above (canonical
        # order: panels -> atlas -> dossier -> phase dossiers -> shelf -> manifest).
        run: |
          uv run python scripts/export_evidence_html.py
          uv run python scripts/export_research_dossier.py
          uv run python -c "import sys; sys.path.insert(0, 'scripts'); from export_research_dossier import export_phase_dossier_meta; export_phase_dossier_meta()"
          uv run python -c "import sys; sys.path.insert(0, 'scripts'); from export_terminal_data import export_knowledge_shelf, export_evidence_matrix_manifest; export_knowledge_shelf(); export_evidence_matrix_manifest()"
        timeout-minutes: 20
        continue-on-error: true  # evidence artifacts degrade honestly; the display panels stay authoritative

      - name: Verify JSON validity
        run: |
          set -e
          for f in web/src/data/aionis/*.json; do
            python3 -c "import json,sys; json.load(open('$f'))" || { echo "INVALID: $f"; exit 1; }
          done
          echo "All JSON valid."

      - name: Contract-test gate (block partial exports before commit)
        # Validity != completeness: a partial export (missing series/panels) is
        # still valid JSON. The macro_drivers regression (fedfunds/real_rate
        # silently dropped, status "ok", deployed cards hidden) landed because
        # this lane committed after a *validity* check only. Gate on the display
        # contract suite instead: an incomplete export fails the run here, keeps
        # the last complete panel committed, and surfaces red instead of silently
        # degrading the deployed terminal.
        # Deselected: test_ledger_append_only_not_mutated_by_export — the reddit
        # collector legitimately appends a data_ingest row to runs/ledger.jsonl
        # during this lane (discarded: the data commit's file_pattern covers only
        # web/src/data/aionis/*.json), so the pinned digest never matches here.
        # The pin guard remains a LOCAL post-export check.
        run: uv run pytest -q tests/test_web_terminal_data.py --deselect tests/test_web_terminal_data.py::test_ledger_append_only_not_mutated_by_export

      - name: Sync with latest main (handle concurrent pushes)
        # If main advanced during this ~hour-long run (code/doc/agent commits
        # pushed while data was fetching), rebase the runner onto the latest
        # tip before committing. Without this, the data push is rejected as
        # non-fast-forward and the ENTIRE run's fetch work is lost (happened
        # on run 31457990487). --autostash preserves the uncommitted data JSONs.
        # Safe because data JSONs never overlap with code/doc/workflow paths.
        run: git pull --rebase --autostash origin main

      - name: Commit refreshed data
        id: datacommit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # NOTE: a GITHUB_TOKEN push NEVER fires on:push workflows (GitHub
          # recursion guard) — removing [skip ci] alone did not make these data
          # commits deploy. The explicit workflow_dispatch step below does.
          commit_message: "chore(data): daily terminal refresh"
          file_pattern: "web/src/data/aionis/*.json"
          commit_user_name: "aionis-bot"
          commit_user_email: "actions@github.com"

      - name: Set up pnpm for site build
        # pnpm build's prebuild hook (web/scripts/build-api.mjs) copies the
        # just-committed panels into public/api/v1 — the deployable data API.
        # Invoking `next build` directly SKIPS the hook and ships a stale API
        # surface (local pitfall 2026-09-05: out/api/v1 was frozen at Sep 1).
        if: steps.datacommit.outputs.changes_detected == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node for site build
        if: steps.datacommit.outputs.changes_detected == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build static site
        if: steps.datacommit.outputs.changes_detected == 'true'
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Checkout gh-pages (publish worktree)
        # deploy-pages.yml is disabled_manually (billing-freeze residue) AND the
        # GitHub-Actions deploy mode is incompatible with this repo's LEGACY
        # gh-pages Pages configuration — the canonical channel since round 50/53
        # is the gh-pages branch. The old `gh workflow run deploy-pages.yml`
        # step failed on every data commit once the workflow was disabled and
        # marked whole green runs red (run 33929716868). Publish here instead:
        # check out gh-pages, rsync the fresh build over it, commit, push — the
        # legacy Pages build deploys it automatically.
        if: steps.datacommit.outputs.changes_detected == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1

      - name: Publish web/out to gh-pages
        if: steps.datacommit.outputs.changes_detected == 'true'
        run: |
          rsync -a --delete --exclude .git web/out/ site/
          cd site
          git config user.name "aionis-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "deploy: main@${GITHUB_SHA::7} — daily terminal data refresh"
          git push origin gh-pages

      - name: Snapshot display-convergence artifacts (always, orphan-safe)
        # Mirror the converging artifacts into the dedicated snapshot dir that
        # the small display-snapshot cache persists. Runs even on partial
        # failures (always()) and KILLS orphans first — killed-with-timeout
        # steps (form4/13d/GDELT caps) leave uv/python children that keep
        # writing; a mid-write cp is harmless (per-file parquet atomicity is
        # good enough at our sizes, and the NEXT run re-extends anything the
        # freshness gate deems stale), but the snapshot DIR itself must be
        # quiescent when its cache post-step tars it.
        if: always()
        run: |
          pkill -f 'uv run' 2>/dev/null || true
          pkill -f 'phase_b_fetch' 2>/dev/null || true
          sleep 2
          mkdir -p data/display-snapshot/prices
          cp -a data/cache/prices/. data/display-snapshot/prices/ 2>/dev/null || true
          cp -a data/cache/phase_b_fundamentals.parquet data/display-snapshot/ 2>/dev/null || true
          echo "snapshot: $(ls data/display-snapshot/prices | wc -l) tickers, fundamentals=$(test -f data/display-snapshot/phase_b_fundamentals.parquet && echo yes || echo no)"
