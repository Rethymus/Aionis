name: Staleness check (terminal data)

# The safety net for the local evening refresh lane (docs/ops-local-refresh.md).
# The lane itself runs on the owner's machine (SessionStart hook + ZCode cron
# automation), so its blind spot is "the machine never opens in the evening for
# days" — the deployed terminal would silently go stale. This workflow is the
# cheap tripwire for exactly that: once a week it reads the COMMITTED
# data_health panel and raises an Issue when the freshest snapshot is old.
#
# Cost: ~1-2 Actions minutes per month (one 30s job weekly) — 0.1% of the
# retired refresh lane's 1,300-1,700 min/month. Public-facing signal (an Issue)
# survives even a fully offline local machine.
#
# Threshold: >5 days (the lane runs Mon-Fri evenings; a holiday weekend plus
# two missed evenings should not page, but a full week must).

on:
  schedule:
    - cron: '37 2 * * *'  # DAILY 02:37 UTC (round 126) — OFF the hour: GitHub
      # docs say the top of the hour is the highest-load window (scikit-learn's
      # nightly runs :30 for the same reason). Was weekly Monday ('17 2 * * 1');
      # now daily so the marker-deadman job below gets a working-day pulse.
      # VERIFICATION-PENDING (billing lock #2, 2026-11-05): this schedule and
      # the new marker-deadman job cannot be live-verified until the owner
      # unlocks billing — first post-unlock run per docs/ops-local-refresh.md
      # billing playbook; handoff round 125's first-Monday billing-residue
      # note applies to ANY first post-unlock run (rerun once, then judge).
      # The deadman job itself is billing-independent (reads git history via
      # API); during a lock the workflow simply does not run (no false reds).
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: staleness-check
  cancel-in-progress: false

jobs:
  marker-deadman:
    # Round 126 remote mirror of --doctor layer 8 (scripts/ops_local_refresh.py
    # marker_deadman): healthchecks.io Period+Grace semantics (BSD-3-Clause,
    # protocol borrow only). Period = one working-day evening; Grace = one
    # working day; weekend SKIP:weekend doesn't tick. Remote observable = the
    # latest `chore(data): evening terminal refresh` commit date on main
    # (the local marker file is gitignored — git history is the honest remote
    # proxy). Zero Actions dependency is impossible here BY DESIGN (this IS
    # an Actions job) — it is the mirror, the local doctor layer 8 is the
    # primary and keeps working through any billing freeze.
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to 26.04 (GH changelog 2026-09-17) — pin for month-stability
    timeout-minutes: 5
    steps:
      - name: Lane marker deadman (Period=1 working day, Grace=1 working day)
        run: |
          python3 - <<'EOF'
          import os, subprocess, datetime

          api = (f"repos/{os.environ['GITHUB_REPOSITORY']}"
                 "/commits?per_page=30")
          out = subprocess.run(
              ["gh", "api", api, "--jq",
               '[.[] | select(.commit.message | '
               'startswith("chore(data): evening terminal refresh"))][0]'
               '.commit.author.date'],
              capture_output=True, text=True)
          latest = out.stdout.strip()
          if out.returncode != 0 or not latest:
              # No lane commit in the last 30 commits, or gh failed: the
              # honest default is FAIL with the reason (never a silent pass).
              print(f"::error::lane marker deadman: no "
                    f"'chore(data): evening terminal refresh' commit found "
                    f"in the last 30 commits (or gh failed: {out.stderr[:120]})")
              raise SystemExit(1)
          last = datetime.date.fromisoformat(latest[:10])
          today = datetime.date.today()

          def next_working_day(d):
              d += datetime.timedelta(days=1)
              while d.weekday() >= 5:  # Mon-Fri clock; holiday absence is
                  d += datetime.timedelta(days=1)  # absorbed by Grace
              return d

          due = next_working_day(last)
          grace = next_working_day(due)
          print(f"last lane commit={last} due={due} grace={grace} today={today}")
          if today > grace:
              days = (today - due).days
              weeks, rem = divmod(days, 7)
              missed = (weeks * 5 + sum(1 for i in range(rem)
                                        if (due.weekday() + i) % 7 < 5))
              print(f"::error::lane marker deadman FIRED: last ok evening "
                    f"{last}, due {due}, grace until {grace} — missed "
                    f"{missed} working evening(s); the lane is silently dead "
                    f"(see docs/ops-local-refresh.md)")
              raise SystemExit(1)
          print("deadman OK: within Period+Grace")
          EOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to 26.04 (GH changelog 2026-09-17) — pin for month-stability
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse committed data_health snapshot age
        id: age
        run: |
          python3 - <<'EOF'
          import json, datetime, os
          health = json.load(open('web/src/data/aionis/data_health.json'))
          snap = health.get('snapshot_ts') or ''
          # snapshot_ts like "2026-09-05T07:59:40.746042+00:00"
          ts = datetime.datetime.fromisoformat(snap)
          age_days = (datetime.datetime.now(datetime.timezone.utc) - ts).days
          print(f'snapshot={snap} age_days={age_days}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'age_days={age_days}\n')
              out.write(f'snapshot={snap}\n')
          EOF

      - name: Open staleness issue (deduped)
        if: steps.age.outputs.age_days > 5
        run: |
          TITLE="terminal data stale: data_health snapshot ${{ steps.age.outputs.snapshot }} (${{ steps.age.outputs.age_days }}d old)"
          BODY=$(cat <<'EOF'
          The committed terminal data (web/src/data/aionis/data_health.json) has
          not refreshed in more than 5 days — the local evening lane has not
          succeeded recently (machine off in the evenings, attempt-cap locked,
          or push/credentials broken).

          Recovery: open ZCode in the Aionis workspace on a weekday evening
          (SessionStart hook fires immediately), or check
          runs/ops_local_refresh/<date>/run.log on the owner machine, or run
          the "Refresh terminal data" workflow_dispatch for a CI catch-up pass.
          See docs/ops-local-refresh.md.
          EOF
          )
          Existing=$(gh issue list --state open --search "terminal data stale" --json number,title --jq 'length')
          if [ "$Existing" -eq 0 ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            echo "An open staleness issue already exists — skipping (dedupe)."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tests health (last CI run)
        # The 09-15/09-28 incidents: data pushed and deployed fine while the
        # full Tests suite went red (stale pins). The nightly LLM report
        # covers this only while ZCode sessions run; this weekly check is the
        # offline net for the same signal.
        run: |
          LAST=$(gh run list --workflow=ci.yml -L 1             --json conclusion --jq '.[0].conclusion')
          echo "last Tests conclusion: $LAST"
          if [ "$LAST" != "success" ]; then
            echo "::error::last Tests run concluded '$LAST' — a data/code push may be red (investigate Actions → Tests)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fresh (no-op)
        if: steps.age.outputs.age_days <= 5
        run: echo "data fresh (${{ steps.age.outputs.age_days }}d old) — nothing to do."

      - name: Publish-chain health (last publish-site run)
        # Zero-token weekly net for the deploy leg: the data freshness check
        # above reads the committed panel, which can be fresh while the
        # publish-site build itself failed (site stale behind the repo). A red
        # run here is the honest signal (owner discipline: no silent failures);
        # transient pnpm hiccups page at most weekly.
        run: |
          LAST=$(gh run list --workflow=publish-site.yml -L 1 \
            --json conclusion --jq '.[0].conclusion')
          echo "last publish-site conclusion: $LAST"
          if [ "$LAST" != "success" ]; then
            echo "::error::last publish-site run concluded '$LAST' — the deployed site may lag the repo (investigate Actions → Publish site)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
