<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="aionis-banner-title aionis-banner-desc">
  <title id="aionis-banner-title">Aionis — falsifiable · anti-leakage quantitative research</title>
  <desc id="aionis-banner-desc">Aionis wordmark beside the logo tile: the letter A holding a rank-IC series inside confidence bounds around a zero axis.</desc>
  <defs>
    <linearGradient id="bBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#1A2C4C"/>
    </linearGradient>
    <linearGradient id="bIc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="8" y="8" width="1184" height="284" rx="56" fill="url(#bBg)"/>
  <rect x="13" y="13" width="1174" height="274" rx="51" fill="none" stroke="#2E4165" stroke-width="3" opacity="0.9"/>

  <!-- logo tile (compact inline re-render of assets/aionis-logo.svg) -->
  <g transform="translate(48,44) scale(0.414)">
    <rect x="16" y="16" width="480" height="480" rx="100" fill="#101A30"/>
    <rect x="21" y="21" width="470" height="470" rx="95" fill="none" stroke="#2E4165" stroke-width="4" opacity="0.9"/>
    <line x1="154" y1="390" x2="256" y2="128" stroke="#E7EEF9" stroke-width="28" stroke-linecap="round"/>
    <line x1="256" y1="128" x2="358" y2="390" stroke="#E7EEF9" stroke-width="28" stroke-linecap="round"/>
    <line x1="224" y1="272" x2="288" y2="272" stroke="#43597F" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 14"/>
    <line x1="224" y1="320" x2="288" y2="320" stroke="#43597F" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 14"/>
    <line x1="214" y1="296" x2="294" y2="296" stroke="#8FA3C4" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 16"/>
    <polyline points="216,296 234,285 252,303 270,279 290,291" fill="none" stroke="url(#bIc)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="216" cy="296" r="6.5" fill="#2DD4BF"/>
    <circle cx="234" cy="285" r="6.5" fill="#2DD4BF"/>
    <circle cx="252" cy="303" r="6.5" fill="#35BFAE"/>
    <circle cx="270" cy="279" r="6.5" fill="#7FA671"/>
    <circle cx="290" cy="291" r="7.5" fill="#F59E0B"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="148" font-family="ui-sans-serif, system-ui, 'Segoe UI', 'Helvetica Neue', Arial, 'Microsoft YaHei', sans-serif" font-size="92" font-weight="700" fill="#E7EEF9" letter-spacing="2">Aionis</text>
  <text x="303" y="208" font-family="ui-sans-serif, system-ui, 'Segoe UI', 'Helvetica Neue', Arial, 'Microsoft YaHei', sans-serif" font-size="32" fill="#9DB0D0">可证伪 · 抗泄漏 · 点时数据 · 预注册双尾检验</text>
  <text x="303" y="250" font-family="ui-sans-serif, system-ui, 'Segoe UI', 'Helvetica Neue', Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#5F7398">falsifiable · anti-leakage · point-in-time · pre-registered, two-tailed</text>
</svg>
