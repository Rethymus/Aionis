# E3 Live-Readiness Contracts (FROZEN - owner ratified 2026-08-03, D2 decision)
#
# These are the AUD-06 owner-gated contracts for E3 forward commits. The owner
# ratified the values below on 2026-08-03 (D2 decision):
#   - max_age_sessions: 22        (~1 month of NYSE sessions; the earlier
#                                  PROPOSED value of 23 was NOT adopted)
#   - authoritative_refresh: null (no standalone refresh script; the refresh
#                                  entry remains scripts/phase_b_fetch.py)
#   - block_on_unknown: true      (fail-closed when the provider cutoff is unknown)
#
# The scheduler (.github/workflows/e3-forward.yml) still runs in shadow mode
# (PHASE_E3_NO_LEDGER=1), which computes everything but writes no ledger rows.
# The automated cron remains DISABLED: headline ignition still needs the owner's
# explicit GO before any irreversible forward commit is enabled.

# Membership Freshness Contract
#
# The max_age_sessions limit ensures the membership snapshot is fresh enough
# for the forward commit. A value of 22 sessions means the snapshot must be
# within ~1 month of NYSE trading sessions of the predict date.
#
# FROZEN VALUE: max_age_sessions: 22 (owner ratified 2026-08-03, D2)
#   - Conservative: ~1 month of NYSE sessions (21-23 sessions per month)
#   - Ensures the S&P 500 universe snapshot is reasonably current
#
# NOTE: This contract is FAIL-CLOSED when not configured. The forward commit
# will refuse to run if this value is not set.
membership_freshness_contract:
  max_age_sessions: 22  # FROZEN — owner ratified 2026-08-03 (D2)
  authoritative_refresh: null  # FROZEN: no standalone refresh script; scripts/phase_b_fetch.py is the refresh entry

# Provider Cutoff Policy
#
# The GLM provider's knowledge cutoff must be verifiable (not "unknown").
# This policy determines whether the forward commit blocks when the provider
# cutoff is unknown.
#
# FROZEN VALUE: block_on_unknown: true (owner ratified 2026-08-03, D2)
#   - Conservative: fail-closed when we cannot verify the knowledge cutoff
#   - Prevents commits with unknown model provenance
#
# NOTE: This contract is FAIL-CLOSED when not configured. The forward commit
# will refuse to run if this value is not set.
provider_cutoff_policy:
  block_on_unknown: true  # FROZEN — owner ratified 2026-08-03 (D2)

  # AMENDMENT (2026-08-29, round 39 — owner-delegated decision authority,
  # "直接决策,非必要不再业主决策"): provider_cutoff added. The GLM-4.5
  # technical report (arXiv 2508.06471) declares NO training-data cutoff
  # date, so a vendor declaration is unavailable. Per the advisory
  # (reports/design/2026-08-29-e3-cutoff-advisory.md, option B), the value
  # below is the EMPIRICAL PROBE BOUNDARY (conservative lower bound):
  #   probe: dual-blind dated-event ladder (runs/provider_cutoff_probe.json,
  #   committed copy reports/evidence/provider-cutoff-probe.json)
  #   result: model KNOWS the 2023-03-10 SVB event; does NOT know 2024-11-06
  #   or later; fake-control (2026-12-25) not fabricated.
  #   -> conservative cutoff 2023-03-10: every E3 predict session (2026-08+)
  #      is far after this date, so training-data lookahead is structurally
  #      excluded for the forward window. Provenance: empirical-probe-v1
  #      (NOT a vendor declaration). The probe artifact is committed for
  #      reader verification.
  provider_cutoff: "2023-03-10"  # EMPIRICAL-PROBE-v1 (conservative lower bound)


