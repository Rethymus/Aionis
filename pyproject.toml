[project]
name = "aionis"
version = "0.1.0"
description = "Aionis MVP — does structured event representation (ERL) carry price-independent signal for predicting sector returns?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aionis" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "pandas-market-calendars>=5.4",
    "statsmodels>=0.14",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "requests>=2.31",
    "structlog>=24.1",
    "beautifulsoup4>=4.12",
    "purgedcv>=0.1.2",
    "openai>=2.48.0",
    "pandas-datareader>=0.10.0",
    "arch>=8.0.0",
    "praw>=8.0.2",
]

[project.optional-dependencies]
# Phase 2-3: live ERL extraction. Heavy (pulls torch via sentence-transformers).
extraction = [
    "openai>=1.40",
    "fredapi>=0.5",
    "sentence-transformers>=3.0",
]
# Phase 4 robustness: combinatorial purged CV + Deflated Sharpe.
robustness = ["purgedcv"]
dev = ["pytest>=8.0", "ruff>=0.5"]
dashboard = [
    "plotly>=5.18",
    "streamlit>=1.30",
    # OSS tearsheet libraries (Apache-2.0 verified per reuse catalog)
    "quantstats>=0.0.62",
    "alphalens-reloaded>=0.0.1",
    "pyfolio-reloaded>=0.0.1",
    # Matplotlib for static figure export from OSS libraries
    "matplotlib>=3.7",
    # CFTC Commitments of Traders (MIT) — free, no-API, public-domain futures
    # positioning data. Used by scripts/cot_fetch.py for the long/short pressure index.
    "cot_reports>=0.1.3",
]
# Quarto research-site rendering (python-cell execution via Jupyter).
quarto = [
    "ipykernel>=6.0",
    "nbclient>=0.10",
    "jupyter-client>=8.0",
    "pyyaml>=6.0",
    # Interactive (searchable/sortable/paginated) DataFrame tables in Quarto.
    # MIT: https://mwouts.github.io/itables/ — Quarto-official recommendation.
    "itables>=2.2",
    # Plotly interactive charts (kept here so the quarto extra is self-contained
    # for CI render, independent of the dashboard extra).
    "plotly>=5.18",
]

[project.scripts]
aionis = "aionis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aionis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# HTML/JS template generation inherently produces long lines.
"scripts/build_static_site.py" = ["E501"]
# Data-export script: long event labels + collector/clearance descriptions.
"scripts/export_terminal_data.py" = ["E501"]
# Form 4 orchestrator tests: compact XML fixtures + monkeypatch chains run long.
"tests/test_form4_orchestrator.py" = ["E501"]
